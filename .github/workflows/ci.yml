# Checks that need no game DLLs: unit tests (pure logic, version consistency), a Roslyn syntax parse of the mod code with Debug
# and Release symbols, and the shell scripts. `make build` / `make package` need the game and stay local. Same as `make ci`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Unit tests
        run: dotnet test InvisibilityPotion.Tests -nologo
      - name: Syntax check (Debug and Release)
        run: dotnet run --project tools/syntax-check -- InvisibilityPotion

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck -S warning -x scripts/*.sh
      - name: Skill frontmatter
        run: |
          python3 -c "import yaml" 2>/dev/null || sudo apt-get install -y -qq python3-yaml
          python3 -I tools/ci/check_skills.py
